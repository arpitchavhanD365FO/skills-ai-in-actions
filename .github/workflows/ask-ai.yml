name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models API (full debug)
        id: call-model
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT_RAW=/tmp/ai_response.raw
          OUT_BODY=/tmp/ai_response.body
          OUT_STATUS=/tmp/ai_response.status

          # Perform the POST and capture headers + body. -i includes headers in output,
          # -sS shows errors, -w captures status code to file.
          # Adjust URL if your environment requires a different base.
          curl -i -sS -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "openai/gpt-4.1",
              "messages": [
                {"role":"system","content":"You are a helpful assistant. Return only a JSON object with key \"joke\" or, if not possible, return plain text containing the joke."},
                {"role":"user","content":"Give me a programming joke."}
              ],
              "temperature": 0
            }' \
            -o "$OUT_RAW" -w "%{http_code}" > "$OUT_STATUS" || true

          status=$(cat "$OUT_STATUS" || true) || status="(none)"
          # Separate headers and body: assume headers end at first blank line
          awk 'BEGIN{h=1} h==1{print > "'"$OUT_RAW"'.tmp"; if($0== "") h=0; next} {print > "'"$OUT_BODY"'}' "$OUT_RAW" || true
          # If awk separation failed, copy raw to body
          if [ ! -s "$OUT_BODY" ]; then
            cat "$OUT_RAW" > "$OUT_BODY"
          fi

          echo "HTTP status: $status"
          echo "----- RAW RESPONSE (headers + body) -----"
          cat "$OUT_RAW" || true
          echo "----- SEPARATED BODY -----"
          cat "$OUT_BODY" || true
          echo "-----------------------------------------"

          # Quick attempts to find JSON in body
          if jq -e . "$OUT_BODY" >/dev/null 2>&1; then
            echo "Body is JSON. Saving to /tmp/ai_response.json"
            cp "$OUT_BODY" /tmp/ai_response.json
          else
            echo "Body does not appear to be JSON."
          fi

          # Try to extract choices[0].message.content if present
          content=$(jq -r '.choices[0].message.content // empty' /tmp/ai_response.json 2>/dev/null || true)
          if [ -n "$content" ]; then
            echo "Extracted assistant content:"
            printf '%s\n' "$content"
            printf '%s' "$content" > /tmp/assistant_content.txt
          else
            echo "No choices[0].message.content found."
          fi

          # Exit non-zero so the run is obvious to review (optional).
          # Comment this out if you prefer the workflow to succeed even for debugging.
          exit 1

      - name: Display AI Response (summary)
        if: always()
        run: |
          echo "## 🤖 Raw AI Response" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See workflow logs for the full raw response (headers + body)."

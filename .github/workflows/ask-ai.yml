name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Call GitHub Models API
        id: ai
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl -sS -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "openai/gpt-4.1",
              "messages": [
                {
                  "role": "system",
                  "content": "Return only valid JSON with a single key named joke."
                },
                {
                  "role": "user",
                  "content": "Give me a programming joke."
                }
              ],
              "response_format": {
                "type": "json_object"
              }
            }' > /tmp/ai_response.json

          python - <<'PY'
          import json
          try:
              data = json.load(open('/tmp/ai_response.json'))
              content = data["choices"][0]["message"]["content"]
              obj = json.loads(content)
              if not isinstance(obj, dict) or "joke" not in obj or not isinstance(obj["joke"], str):
                  raise ValueError("Schema mismatch")
              print(obj["joke"])
          except Exception as e:
              print("AI response was not valid JSON:", e)
              print(open('/tmp/ai_response.json').read())
              raise
          PY

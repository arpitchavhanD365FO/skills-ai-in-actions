name: Ask AI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Call OpenAI Chat API (robust + debug)
        id: call-openai
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          OUT=/tmp/ai_response.json

          # Choose your model: change to "gpt-4" if you have access
          MODEL="gpt-3.5-turbo"

          http_code=$(curl -sS -o "$OUT" -w "%{http_code}" \
            -X POST "https://api.openai.com/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "'"$MODEL"'",
              "messages": [
                {"role":"system","content":"You are a helpful assistant. Respond with ONLY a single valid JSON object and nothing else. The JSON must be: {\"joke\":\"<a programming joke>\"}"},
                {"role":"user","content":"Give me a programming joke."}
              ],
              "temperature": 0
            }')

          echo "HTTP status: $http_code"
          echo "----- RAW RESPONSE -----"
          cat "$OUT" || true
          echo "------------------------"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "ERROR: API call returned HTTP $http_code"
            exit 1
          fi

          # Extract assistant content
          content=$(jq -r '.choices[0].message.content // empty' "$OUT" 2>/dev/null || true)

          if [ -z "$content" ]; then
            echo "ERROR: no choices[0].message.content found in response — dumping raw response for debugging:"
            cat "$OUT"
            exit 1
          fi

          echo "----- ASSISTANT CONTENT -----"
          printf '%s\n' "$content"
          echo "-----------------------------"

          # Try to parse assistant content as JSON and pull "joke"
          joke=$(printf '%s' "$content" | jq -r '.joke // empty' 2>/dev/null || true)

          if [ -n "$joke" ]; then
            echo "Extracted joke from JSON content."
            printf '%s' "$joke" > /tmp/joke.txt
            echo "joke_source=json" >> $GITHUB_OUTPUT
          else
            # Fallback: use assistant content as plain text (sanitize surrounding quotes)
            plain=$(printf '%s' "$content" | sed -E 's/^[[:space:]]+"//; s/"[[:space:]]*$//; s/^[[:space:]]+//; s/[[:space:]]+$//')
            if [ -z "$plain" ]; then
              echo "ERROR: assistant content is present but empty after sanitization."
              echo "Assistant content was:"
              printf '%s\n' "$content"
              exit 1
            fi
            echo "Using assistant content as plain text fallback."
            printf '%s' "$plain" > /tmp/joke.txt
            echo "joke_source=plain" >> $GITHUB_OUTPUT
          fi

      - name: Display AI Response
        if: always()
        shell: bash
        run: |
          echo "## 🤖 AI Response" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/joke.txt ]; then
            cat /tmp/joke.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No valid joke was extracted. See previous logs for raw response."
          fi

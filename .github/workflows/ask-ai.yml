name: Ask AI
on:
  workflow_dispatch:

permissions:
  models: read
jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Give me a programming joke. Respond with a single valid JSON object and NOTHING ELSE.
            The JSON must match this schema exactly:
            {
              "joke": "<a programming joke string>"
            }
            Provide a programming joke as the value of the "joke" key. Do not include any extra text, commentary, or delimiters.

      - name: Display AI Response
        run: |
          echo "## 🤖 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.ai-response.outputs.response }}" >> $GITHUB_STEP_SUMMARY
